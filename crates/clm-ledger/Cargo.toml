[package]
name = "clm-ledger"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["git"]
# Reading, writing and pushing ledger branches; off for wasm builds, which keep only
# `fold_records` (`ledger-builds-for-wasm`).
git = [
    "dep:clm-git",
    "dep:clm-config",
    "dep:clm-gate",
    "dep:sha2",
    "dep:getrandom",
    "dep:tempfile",
    "dep:toml",
]

[[test]]
name = "append"
required-features = ["git"]

[[test]]
name = "code_key"
required-features = ["git"]

[[test]]
name = "fold"
required-features = ["git"]

[[test]]
name = "sign"
required-features = ["git"]

[[test]]
name = "writer"
required-features = ["git"]

[dependencies]
clm-git = { workspace = true, optional = true }
clm-config = { workspace = true, optional = true }
clm-gate = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
getrandom = { version = "0.4", optional = true }
tempfile = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
