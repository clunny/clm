[package]
name = "clm-web-replica"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clm-replica.workspace = true
clm-web-live.workspace = true
clm-web-platform.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned with `clm-web`'s: `worker-build` must match its `wasm-bindgen`.
worker = "=0.8.7"
futures = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
clm-web-platform = { workspace = true, features = ["fake"] }
futures = { version = "0.3", default-features = false, features = ["async-await", "executor"] }
