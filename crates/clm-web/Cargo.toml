[package]
name = "clm-web"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clm-ledger = { workspace = true, default-features = false }
clm-web-live.workspace = true
clm-web-platform.workspace = true
clm-web-review.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
base64.workspace = true
futures = { version = "0.3", default-features = false, features = ["async-await"] }
hmac = "0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned: `worker` moves fast, and `worker-build` must match its `wasm-bindgen`.
worker = "=0.8.7"
# The `Live` Durable Object class, which `lib.rs` re-exports for `web/wrangler.toml` to bind.
clm-web-live = { workspace = true, features = ["durable"] }
# The `Replica` Durable Object class, which `lib.rs` re-exports for `web/wrangler.toml` to bind.
clm-web-replica.workspace = true

[dev-dependencies]
clm-model.workspace = true
# The writes' tests drive a real `Replica` object over the fake GitHub (`writes-to-object`).
clm-web-replica.workspace = true
clm-replica.workspace = true
clm-web-platform = { workspace = true, features = ["fake"] }
clm-check.workspace = true
clm-context.workspace = true
clm-ledger.workspace = true
futures = { version = "0.3", default-features = false, features = ["async-await", "executor"] }
tempfile.workspace = true
toml.workspace = true
