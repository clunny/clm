[package]
name = "clm-effort"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["git"]
# Reading transcripts and the repository's history, and writing `effort` records to the
# ledger; off for wasm builds, which keep the review page's pure part
# (`effort-builds-for-wasm`).
git = ["dep:clm-git", "dep:clm-check", "dep:serde_yaml", "clm-ledger/git"]

[[test]]
name = "record"
required-features = ["git"]

[[test]]
name = "transcripts"
required-features = ["git"]

[[test]]
name = "history"
required-features = ["git"]

[dependencies]
clm-check = { workspace = true, optional = true }
clm-git = { workspace = true, optional = true }
clm-ledger = { workspace = true, default-features = false }
clm-model.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
